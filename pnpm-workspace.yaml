# pnpm 配置载体。
#
# ★ allowBuilds 只认这个文件：写进 .npmrc 或 package.json 会被静默忽略。
# ★ pnpm 默认「不执行任何依赖的安装脚本」（供应链防护）；被拦下的依赖会让
#   `pnpm install` 以 ERR_PNPM_IGNORED_BUILDS 非零退出，CI 里 --frozen-lockfile 直接失败。
#   所以每一个带 install/postinstall 的依赖都必须在这里表态（true 批准 / false 显式拒绝）。
#   ⚠️ pnpm 自己追加的 `xxx: set this to true or false` 占位项**不算决定**，构建仍会被拒。
packages:
  - '.'

allowBuilds:
  # vite / electron-vite 的打包器：postinstall 要下载平台二进制，不批就 `vite build` 起不来。
  esbuild: true
  # Windows 打包目标的传递依赖（electron-builder → electron-winstaller）：
  # 它的 install 脚本按当前架构挑选 7z 可执行文件，NSIS / Squirrel 目标都要用它。
  # ★ 本项目发三平台（Linux + Windows + macOS），Windows 那一份走 NSIS，因此必须批准；
  #   此前是 false（当时只有 Linux 产物）—— 改回 false 会让 Windows 打包在 CI 上失败。
  electron-winstaller: true

# vitest 5.0.4 比 pnpm 默认的「最小发布年龄」策略更新，不豁免就装不上。
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - vitest@5.0.4
