appId: io.github.edwinhuish.songloft-desktop
productName: Songloft Desktop
copyright: Copyright © 2026 Songloft Desktop contributors

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'

extraResources:
  # 托盘图标：build/ 不会进包，托盘在运行期要读一个真实文件（skill 第一节）。
  - from: build/icon-source.png
    to: tray.png
  # 窗口 / 任务栏图标：与托盘同源，但另取一个中性的名字 —— src/main/app-icon.ts 读的是它。
  # 不合并成同一个文件名，是为了让「谁在读哪一份」一眼可辨（同源两份才 88KB，不值得省）。
  - from: build/icon-source.png
    to: icon.png
  # AppImage 专用 AppArmor profile 完整版（deb 那份由 electron-builder 内建生成并自动安装）。
  # 文件名必须与 profile 内声明的名字、以及安装目标 /etc/apparmor.d/<executableName> 三处同源。
  - from: build/apparmor-profile
    to: apparmor/songloft-desktop

# 本项目没有任何原生（node-gyp）依赖 —— 显式关闭，避免打包机被迫装 gcc/make/python。
npmRebuild: false

# ── 文件关联：双击音频文件就用本应用打开（应用内对应 src/main/local-files.ts）──────────
# 一份配置三种落地：macOS 写进 Info.plist 的 CFBundleDocumentTypes、Windows 由 NSIS 写注册表
# （注册表里的命令是 `"$appExe \"%1\""`，也就是**路径经 argv 递进来**）、Linux 由
# electron-builder 拼进 .desktop 的 MimeType。
#
# ★ 每条 association 的 mimeType **只作用于 Linux**，所以按「一个 MIME 一组扩展名」列，
#   而不是把十几个扩展名塞进一条：一条只能带一个 mimeType，那样装出来的 .desktop 只声明了
#   其中一种格式，其余格式在「打开方式」里根本不出现（且构建期一声不响）。
# ★ 只列 Chromium 真能解码的格式（与 src/shared/local-file.ts 那张表同源）。认领了却放不出来
#   （wma / ape / wv / dsf 这类）比不认领更糟 —— 用户双击之后只得到一句「无法解码」，
#   而系统里那份关联已经被我们抢走了。
fileAssociations:
  - ext: [mp3, mp2, mpga]
    name: MP3 音频
    description: MP3 音频文件
    role: Viewer
    mimeType: audio/mpeg
  - ext: m4a
    name: MPEG-4 音频
    description: M4A 音频文件
    role: Viewer
    mimeType: audio/mp4
  - ext: aac
    name: AAC 音频
    description: AAC 音频文件
    role: Viewer
    mimeType: audio/aac
  - ext: flac
    name: FLAC 无损音频
    description: FLAC 无损音频文件
    role: Viewer
    mimeType: audio/flac
  - ext: [ogg, oga, opus]
    name: Ogg 音频
    description: Ogg / Opus 音频文件
    role: Viewer
    mimeType: audio/ogg
  - ext: wav
    name: WAV 音频
    description: WAV 音频文件
    role: Viewer
    mimeType: audio/x-wav

linux:
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  executableName: songloft-desktop
  # ★ 指**目录**（scripts/make-icons.sh 生成的 16…512 全套），不要指单张母版：
  #   electron-builder 会把目录里每个文件按它自己声明的尺寸投进
  #   usr/share/icons/hicolor/<size>/apps/<executableName>.png。
  #   给它单张 1024×1024 时，AppImage 里就只会出现 hicolor/1024x1024/ 这一个目录 ——
  #   而 hicolor 的 index.theme **没有声明** 1024x1024，于是「条目里的 Icon=」这一步会静默
  #   查不到任何文件（桌面集成工具照搬这套目录结构也一样查不到）。全部尺寸都落在声明过的目录里。
  icon: build/icons
  category: AudioVideo
  synopsis: 插件化、无广告的免费音乐播放器
  description: >-
    Songloft Desktop 是 Songloft 音乐播放器的 Electron 桌面客户端。连接自建 Songloft 后端
    （默认 http://localhost:58091），支持曲库浏览、歌单管理、逐字歌词、文件夹浏览与播放队列。
  # ★ 决定产物 .desktop 的文件名。默认 false → 会被命名成 executableName（songloft-desktop），
  #   与 app.setDesktopName() 报出的 app_id 对不上，GNOME 下静默回落成占位图标。
  #
  #   身份（= appId = app_id = StartupWMClass）取 io.github.edwinhuish.songloft-desktop。
  #   ⚠️ 刻意**不让身份以 `.desktop` 结尾** —— electron-builder / Electron 都会「去掉一层
  #   `.desktop` 才是身份」，身份若自己也以 `.desktop` 结尾（例如 com.songloft.desktop），
  #   就得把 package.json 的 desktopName 写成 com.songloft.desktop.desktop 才不会削错，
  #   极易看错且错法完全静默。现在两边一致、没有重复后缀：
  #     desktopName == 身份 == io.github.edwinhuish.songloft-desktop
  #     落地文件名 == 身份 + .desktop == io.github.edwinhuish.songloft-desktop.desktop
  syncDesktopName: true
  # ★ 这里只留 URL 协议那一条；**音频 MIME 不写在这儿** —— 它们由上面 fileAssociations 的
  #   mimeType 自动带进 .desktop 的 MimeType。写成 desktop.entry.MimeType 是不行的：
  #   那一项会被 electron-builder 用「fileAssociations + protocols 算出来的那份」整个覆盖
  #   （LinuxTargetHelper 里是直接赋值，不是合并），看着写了、实际静默失效。
  mimeTypes:
    - x-scheme-handler/songloft
  desktop:
    entry:
      # ★ 必须等于身份（= package.json 的 desktopName）。
      StartupWMClass: io.github.edwinhuish.songloft-desktop
      Name: Songloft Desktop
      Comment: 插件化、无广告的免费音乐播放器
      Categories: AudioVideo;Audio;Player;
      Keywords: music;player;songloft;audio;

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
  # electron-builder 会把这个 1024×1024 的 PNG 转成 .ico。**必须显式写**：不写时它去找
  # build/icon.ico / build/icon.png，而本仓库这两份都没有 —— 那样 Windows 产物会静默退回
  # Electron 默认图标，且只有装到别人机器上才看得出来。
  icon: build/icon-source.png

nsis:
  # 不做「点一下装完」：播放器不是运行时组件，用户需要能挑安装目录。
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 按当前用户安装，避免每次安装都弹 UAC
  perMachine: false
  installerLanguages: [zh_CN, en_US]
  # 卸载时保留用户数据：设置 / 凭据 / 服务器列表都在 %APPDATA%，删掉等于让用户重登一遍
  deleteAppDataOnUninstall: false

# ── macOS ────────────────────────────────────────────────────────────────────
mac:
  target:
    # dmg 供人工下载安装；zip 供不便挂载 dmg 的场景（脚本化分发 / 后续自动更新）
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.music
  # 与 win / linux 同一份母版，electron-builder 自行转 .icns
  icon: build/icon-source.png
  # ⚠️ 产物**未签名**：CI 里没有证书，release.yml 用 CSC_IDENTITY_AUTO_DISCOVERY=false
  #   关掉身份探测。将来要签名 / 公证时：补 CSC_LINK 与 CSC_KEY_PASSWORD secrets、
  #   删掉那一行，并重新评估 hardenRuntime 与 entitlements。

# AppImage 的静态 runtime：彻底去掉对 libfuse2（Ubuntu 24.04+ 已改名 libfuse2t64）的依赖。
# 固定版本而不是等默认值，避免某次升级静默改变产物行为。
toolsets:
  appimage: '1.0.3'
